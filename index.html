<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>মাথা মাস্টার / Matha Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--cyan:#22d3ee;--gold:#fbbf24;--gold2:#f59e0b;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16)}
body{font-family:'Hind Siliguri','Poppins',sans-serif;background:linear-gradient(160deg,#070b2e 0%,#1b1040 55%,#3b1163 100%);color:#fff;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 30px;position:relative}
button{font-family:inherit;cursor:pointer;border:none}
input,select{font-family:inherit}
.hud{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;position:sticky;top:8px;z-index:30;backdrop-filter:blur(6px)}
.hud .pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.coinbox{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--gold2);color:var(--gold);font-weight:800;border-radius:999px;padding:5px 12px;font-size:16px;position:relative}
.coin-ic{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b);display:inline-flex;align-items:center;justify-content:center;color:#7c2d12;font-size:12px;font-weight:800}
.iconbtn{background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px}
.floatcoin{position:absolute;right:8px;top:-4px;color:var(--gold);font-weight:800;animation:floatUp 1s ease-out forwards;pointer-events:none;text-shadow:0 2px 6px #000}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pulse{animation:pulse .45s ease}
.logo{text-align:center;margin:26px 0 4px;font-size:44px;font-weight:800;line-height:1.15;text-shadow:0 4px 18px rgba(34,211,238,.45)}
.logo .en{display:block;font-family:'Poppins';font-size:19px;letter-spacing:3px;color:var(--cyan);font-weight:700}
.tagline{text-align:center;color:#c4b5fd;font-size:15px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:18px;font-weight:700;color:#082f3a;background:linear-gradient(180deg,#67e8f9,#06b6d4);box-shadow:0 5px 0 #0e7490,0 10px 18px rgba(0,0,0,.35);margin-bottom:12px;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0e7490}
.btn.gold{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#451a03;box-shadow:0 5px 0 #b45309,0 10px 18px rgba(0,0,0,.35)}
.btn.gold:active{box-shadow:0 2px 0 #b45309}
.btn.purple{background:linear-gradient(180deg,#c4b5fd,#7c3aed);color:#fff;box-shadow:0 5px 0 #5b21b6,0 10px 18px rgba(0,0,0,.35)}
.btn.purple:active{box-shadow:0 2px 0 #5b21b6}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);border:1px solid var(--line)}
.btn:disabled{opacity:.45;filter:grayscale(.5)}
.btn.small{padding:11px;font-size:15px}
.namein{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font-size:16px;margin-bottom:12px}
.worldtitle{font-size:19px;font-weight:800;margin:16px 0 10px;color:var(--cyan)}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lvl{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#164e63,#0e7490);color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.4);border:1px solid var(--line)}
.lvl .st{font-size:11px;color:var(--gold);letter-spacing:1px}
.lvl.boss{background:linear-gradient(180deg,#7c2d12,#b45309)}
.lvl.lock{background:rgba(255,255,255,.07);color:#94a3b8;box-shadow:none}
.lvl.done{background:linear-gradient(180deg,#14532d,#16a34a)}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#c4b5fd;margin:14px 0 8px;font-weight:600}
.qcat{background:rgba(34,211,238,.15);border:1px solid var(--cyan);color:var(--cyan);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.tbar{height:14px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.tfill{height:100%;background:linear-gradient(90deg,#22d3ee,#34d399);border-radius:999px;transition:width .1s linear}
.tfill.low{background:linear-gradient(90deg,#ef4444,#f59e0b)}
.qtext{font-size:21px;font-weight:700;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{padding:15px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff;font-size:17px;font-weight:600;text-align:left;transition:background .15s}
.opt:active{transform:scale(.99)}
.opt.correct{background:#16a34a!important;border-color:#4ade80}
.opt.wrong{background:#dc2626!important;border-color:#f87171}
.opt.hide{visibility:hidden}
.opt:disabled{opacity:.92}
.lifelines{display:flex;gap:8px;margin-top:14px}
.life{flex:1;padding:11px 4px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--gold2);color:#fff;font-size:13px;font-weight:700}
.life b{color:var(--gold);display:block;font-size:12px;margin-top:2px}
.life:disabled{opacity:.4;border-color:var(--line)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.mbox{background:linear-gradient(170deg,#1e1b4b,#312e81);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow:auto;text-align:center}
.mbox h2{font-size:26px;margin-bottom:8px}
.bigstars{font-size:36px;color:var(--gold);letter-spacing:4px;margin:6px 0}
.pack{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;width:100%;color:#fff;text-align:left}
.pack .amt{font-size:20px;font-weight:800}
.pack .cn{color:var(--gold);font-weight:800;font-size:17px}
.badge{background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.methods{display:flex;gap:8px;margin:10px 0}
.method{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-weight:800}
.method.sel{border-color:var(--cyan);background:rgba(34,211,238,.15)}
label.fl{display:block;text-align:left;font-size:14px;font-weight:600;margin:10px 0 5px;color:#ddd6fe}
select.namein{appearance:none}
.warn{background:rgba(220,38,38,.15);border:1px solid #ef4444;color:#fecaca;border-radius:12px;padding:10px;font-size:13.5px;margin:12px 0;line-height:1.5}
.okmsg{background:rgba(22,163,74,.18);border:1px solid #22c55e;color:#bbf7d0;border-radius:12px;padding:12px;font-size:14.5px;line-height:1.6;display:none}
.footer{text-align:center;color:#a5b4fc;font-size:12.5px;line-height:1.7;margin-top:22px}
.footer .brand{color:var(--gold);font-weight:800;font-size:14px}
.ver{opacity:.65;font-size:11px;margin-top:4px}
.hidden{display:none!important}
.reqitem{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;text-align:left;margin-bottom:8px;word-break:break-all}
.howto-txt{text-align:left;font-size:15px;line-height:1.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="pname" id="hudName">Guest</span>
    <button class="iconbtn" id="langBtn">EN</button>
    <button class="iconbtn" id="soundBtn">🔊</button>
    <div class="coinbox" id="coinBox"><span class="coin-ic">৳</span><span id="coinAmt">100</span></div>
  </div>

  <!-- HOME -->
  <section id="scr-home">
    <div class="logo">মাথা মাস্টার<span class="en">MATHA MASTER</span></div>
    <div class="tagline" data-i="tagline"></div>
    <div class="card">
      <input class="namein" id="nameInput" maxlength="24">
      <button class="btn" id="playBtn"></button>
      <button class="btn purple" id="mapBtn"></button>
      <button class="btn gold" id="buyBtn"></button>
      <button class="btn ghost" id="dailyBtn"></button>
      <button class="btn ghost" id="howBtn"></button>
    </div>
    <div class="footer">
      <div class="brand">Songlap</div>
      <div data-i="disclaimer"></div>
      <div class="ver" id="verTap">v1.0</div>
    </div>
  </section>

  <!-- LEVEL MAP -->
  <section id="scr-map" class="hidden">
    <div class="qmeta"><button class="iconbtn" data-back>← <span data-i="home"></span></button><b data-i="chooseLevel"></b><span></span></div>
    <div id="worlds"></div>
  </section>

  <!-- GAME -->
  <section id="scr-game" class="hidden">
    <div class="qmeta">
      <span id="qLevel"></span><span class="qcat" id="qCat"></span><span id="qProg"></span>
    </div>
    <div class="tbar"><div class="tfill" id="tFill" style="width:100%"></div></div>
    <div class="qtext" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="lifelines">
      <button class="life" id="lifeFifty"></button>
      <button class="life" id="lifeTime"></button>
      <button class="life" id="lifeSkip"></button>
    </div>
    <button class="btn ghost small" id="quitBtn" style="margin-top:14px"></button>
  </section>

  <!-- BUY COINS -->
  <section id="scr-buy" class="hidden">
    <div class="qmeta"><button class="iconbtn" data-back>← <span data-i="home"></span></button><b data-i="buyCoins"></b><span></span></div>
    <div id="packList"></div>
    <div class="card">
      <div style="font-weight:700" data-i="payMethod"></div>
      <div class="methods">
        <button class="method sel" data-m="bKash">bKash</button>
        <button class="method" data-m="Nagad">Nagad</button>
        <button class="method" data-m="Rocket">Rocket</button>
      </div>
      <div id="payNumBox" style="font-size:15px;line-height:1.6"></div>
      <label class="fl" data-i="fName"></label>
      <input class="namein" id="fNameIn" maxlength="24">
      <label class="fl" data-i="fSender"></label>
      <input class="namein" id="fSenderIn" inputmode="tel" maxlength="15" placeholder="01XXXXXXXXX">
      <label class="fl" data-i="fTrx"></label>
      <input class="namein" id="fTrxIn" maxlength="20">
      <label class="fl" data-i="fPkg"></label>
      <select class="namein" id="fPkgSel"></select>
      <div class="warn" data-i="pinWarn"></div>
      <button class="btn gold" id="reqBtn"></button>
      <div class="okmsg" id="reqOk"></div>
    </div>
  </section>
</div>

<!-- RESULT MODAL -->
<div class="modal" id="resultModal"><div class="mbox">
  <h2 id="resTitle"></h2>
  <div class="bigstars" id="resStars"></div>
  <div id="resInfo" style="font-size:16px;line-height:1.7;margin-bottom:14px"></div>
  <button class="btn gold hidden" id="resPassBuy"></button>
  <button class="btn hidden" id="resNext"></button>
  <button class="btn purple" id="resRetry"></button>
  <button class="btn ghost" id="resMap"></button>
</div></div>

<!-- HOW TO PLAY MODAL -->
<div class="modal" id="howModal"><div class="mbox">
  <h2 data-i="howto"></h2>
  <div class="howto-txt" data-i="howText"></div>
  <button class="btn" id="howClose" style="margin-top:14px"></button>
</div></div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminModal"><div class="mbox">
  <h2>Demo Admin (this device only)</h2>
  <label class="fl">Add coins / কয়েন যোগ করুন</label>
  <input class="namein" id="admAmt" type="number" placeholder="500">
  <button class="btn gold" id="admAdd">Add / যোগ করুন</button>
  <div style="font-weight:700;margin:14px 0 8px;text-align:left">Payment requests / পেমেন্ট অনুরোধ</div>
  <div id="reqList"></div>
  <button class="btn purple" id="admReset">Reset all progress / সব রিসেট</button>
  <button class="btn ghost" id="admClose">Close / বন্ধ</button>
</div></div>

/* ================= NUMBER-SEQUENCE GENERATOR ================= */
function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function genSequence(){
  const kind = ri(0,2); let seq=[], ans=0;
  if(kind===0){ const s=ri(2,40), d=ri(2,12); for(let i=0;i<4;i++) seq.push(s+d*i); ans=s+d*4; }
  else if(kind===1){ const s=ri(1,6), r=ri(2,3); for(let i=0;i<4;i++) seq.push(s*Math.pow(r,i)); ans=s*Math.pow(r,4); }
  else { const s=ri(1,20); let d=ri(1,4); const inc=ri(1,2); seq.push(s); let cur=s; for(let i=0;i<3;i++){ cur+=d; seq.push(cur); d+=inc; } ans=cur+d; }
  const cand = new Set([ans]);
  while(cand.size<4){ const v = ans + [ri(-10,-1),ri(1,10),ri(-3,3),ans][ri(0,3)]; if(v>0 && v!==ans) cand.add(v); }
  const opts = shuffle([...cand]);
  const txt = seq.join(", ") + ", ?";
  return { qbn:"ক্রমটির পরের সংখ্যা কোনটি? "+txt, qen:"What is the next number in the sequence? "+txt,
           obn:opts.map(String), oen:opts.map(String), a:opts.indexOf(ans), cat:"math", gen:true };
}

/* ================= AUDIO ================= */
let AC=null;
function beep(freq,dur,type,delay){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+(delay||0);
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(.16,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur);
  }catch(e){}
}
const sndClick=()=>beep(620,.07,"triangle");
const sndGood=()=>{ beep(660,.1,"sine"); beep(880,.14,"sine",.09); };
const sndBad=()=>beep(170,.25,"sawtooth");
const sndWin=()=>{ [523,659,784,1046].forEach((f,i)=>beep(f,.16,"triangle",i*.11)); };

/* ================= LEVEL CONFIG ================= */
function tierOf(lv){ return lv<=10?0 : lv<=20?1 : 2; }
function isBoss(lv){ return lv%10===0; }
function poolOf(lv){ return tierOf(lv)===0?QE : tierOf(lv)===1?QM : QH; }
function timeOf(lv){ if(isBoss(lv)) return 18; return [30,25,20][tierOf(lv)]; }
function needOf(lv){ if(isBoss(lv)) return 6; return lv<=10?3:4; }
function totalOf(lv){ return isBoss(lv)?8:5; }
function earnOf(lv){ return [10,15,20][tierOf(lv)]; }
function bonusOf(lv){ if(isBoss(lv)) return 100; return [20,30,50][tierOf(lv)]; }

    const h=document.createElement("div"); h.className="worldtitle";
    h.textContent = (wi===0?"🌱":wi===1?"🔥":"💀")+" "+names[wi]+" • "+t("level")+" "+(wi*10+1)+"–"+(wi*10+10);
    w.appendChild(h);
    const g=document.createElement("div"); g.className="lgrid";
    for(let lv=wi*10+1; lv<=wi*10+10; lv++){
      const b=document.createElement("button");
      const locked = lv>S.unlocked, st=S.stars[lv]||0;
      b.className="lvl"+(isBoss(lv)?" boss":"")+(locked?" lock":st>0?" done":"");
      b.innerHTML = locked ? "🔒" : lv + '<span class="st">'+"★".repeat(st)+"☆".repeat(3-st)+"</span>" + (isBoss(lv)?'<span class="st">👑</span>':"");
      if(!locked) b.onclick=()=>{ sndClick(); startLevel(lv); };
      g.appendChild(b);
    }
    w.appendChild(g);
  }
}

/* ================= GAME ENGINE ================= */
let G=null, timerInt=null;
function buildQuestions(lv){
  const total=totalOf(lv), pool=shuffle(poolOf(lv));
  let seqCount = tierOf(lv)===0 ? 0 : Math.round(total*0.3);
  const qs = pool.slice(0, total-seqCount);
  while(qs.length<total) qs.push(genSequence());
  return shuffle(qs);
}
function startLevel(lv){
  if(!S.name){ const v=$("nameInput").value.trim(); if(!v){ alert(t("needName")); show("scr-home"); $("nameInput").focus(); return; } S.name=v; save(); }
  G={ lv, qs:buildQuestions(lv), idx:0, correct:0, earned:0, timeLeft:0, locked:false, fiftyUsed:false };
  show("scr-game"); nextQuestion();
}
function stopTimer(){ if(timerInt){ clearInterval(timerInt); timerInt=null; } }
function nextQuestion(){
  stopTimer();
  if(G.idx>=G.qs.length){ endLevel(); return; }
  G.locked=false; G.fiftyUsed=false;
  const q=G.qs[G.idx];
  $("qLevel").textContent = t("level")+" "+G.lv+(isBoss(G.lv)?" 👑":"");
  $("qCat").textContent = catName(q.cat);
  $("qProg").textContent = t("question")+" "+(G.idx+1)+"/"+G.qs.length;
  $("qText").textContent = S.lang==="bn" ? q.qbn : q.qen;
  const box=$("qOpts"); box.innerHTML="";
  const opts = S.lang==="bn" ? q.obn : q.oen;
  opts.forEach((txt,i)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=txt; b.dataset.i=i;
    b.onclick=()=>answer(i,b); box.appendChild(b);
  });
  updateLifelines();
  G.timeLeft=timeOf(G.lv); drawTimer();
  timerInt=setInterval(()=>{ G.timeLeft=Math.max(0, G.timeLeft-0.1); drawTimer(); if(G.timeLeft<=0){ stopTimer(); onTimeout(); } },100);
}
function drawTimer(){
  const total=timeOf(G.lv), pct=(G.timeLeft/total)*100;
  const f=$("tFill"); f.style.width=pct+"%"; f.classList.toggle("low", G.timeLeft<=5);
}
function markCorrectBtn(){
  const q=G.qs[G.idx];
  document.querySelectorAll("#qOpts .opt").forEach(b=>{ b.disabled=true; if(+b.dataset.i===q.a) b.classList.add("correct"); });
}
function answer(i,btn){
  if(G.locked) return; G.locked=true; stopTimer();
  const q=G.qs[G.idx];
  if(i===q.a){ btn.classList.add("correct"); sndGood(); const e=earnOf(G.lv); G.correct++; G.earned+=e; addCoins(e); }
  else { btn.classList.add("wrong"); markCorrectBtn(); sndBad(); }
  document.querySelectorAll("#qOpts .opt").forEach(b=>b.disabled=true);
  setTimeout(()=>{ G.idx++; nextQuestion(); }, 950);
}
function onTimeout(){
  if(G.locked) return; G.locked=true; markCorrectBtn(); sndBad();
  setTimeout(()=>{ G.idx++; nextQuestion(); }, 950);
}
function updateLifelines(){
  const q=G.qs[G.idx];
  const lf=$("lifeFifty"), lt=$("lifeTime"), ls=$("lifeSkip");
  lf.innerHTML = t("fifty")+"<b>🪙 "+PRICE.fifty+"</b>";
  lt.innerHTML = t("time")+"<b>🪙 "+PRICE.time+"</b>";
  ls.innerHTML = t("skip")+"<b>🪙 "+PRICE.skip+"</b>";
  lf.disabled = G.fiftyUsed || S.coins<PRICE.fifty;
  lt.disabled = S.coins<PRICE.time;
  ls.disabled = S.coins<PRICE.skip;
}
function spend(n){ if(S.coins<n){ alert(t("noCoins")); return false; } S.coins-=n; save(); updateHUD(); return true; }
$("lifeFifty").onclick=()=>{
  if(!G || G.locked || G.fiftyUsed) return;
  if(!spend(PRICE.fifty)) return;
  G.fiftyUsed=true; sndClick();
  const q=G.qs[G.idx];
  const wrongs=shuffle([0,1,2,3].filter(i=>i!==q.a)).slice(0,2);
  document.querySelectorAll("#qOpts .opt").forEach(b=>{ if(wrongs.includes(+b.dataset.i)) b.classList.add("hide"); });
  updateLifelines();
};
$("lifeTime").onclick=()=>{ if(!G || G.locked) return; if(!spend(PRICE.time)) return; sndClick(); G.timeLeft+=15; drawTimer(); updateLifelines(); };
$("lifeSkip").onclick=()=>{ if(!G || G.locked) return; if(!spend(PRICE.skip)) return; sndClick(); stopTimer(); G.idx++; nextQuestion(); };
$("quitBtn").onclick=()=>{ stopTimer(); G=null; renderMap(); show("scr-map"); };

function endLevel(){
  stopTimer();
  const lv=G.lv, total=G.qs.length, need=needOf(lv);
  const passed = G.correct>=need;
  let stars=0, bonus=0;
  if(passed){
    stars = G.correct>=total ? 3 : G.correct===total-1 ? 2 : 1;
    if(!S.stars[lv]){ bonus=bonusOf(lv); G.earned+=bonus; addCoins(bonus); }
    if(stars>(S.stars[lv]||0)) S.stars[lv]=stars;
    if(lv===S.unlocked && lv<30) S.unlocked=lv+1;
    save();
  }
  $("resTitle").textContent = passed ? t("pass") : t("fail");
  $("resStars").textContent = passed ? "★".repeat(stars)+"☆".repeat(3-stars) : "";
  $("resInfo").innerHTML = t("level")+" "+lv+" • "+t("correctTxt")+": <b>"+G.correct+"/"+total+"</b><br>🪙 "+t("earned")+": <b>"+G.earned+"</b>"+(bonus?" (+"+bonus+" ⭐)":"");
  const pb=$("resPassBuy");
  if(!passed && G.correct===need-1){ pb.classList.remove("hidden"); pb.textContent=t("passBuy"); pb.disabled=S.coins<PRICE.passBuy; }
  else pb.classList.add("hidden");
  const nx=$("resNext");
  if(passed && lv<30){ nx.classList.remove("hidden"); nx.textContent=t("next"); } else nx.classList.add("hidden");
  $("resRetry").textContent=t("retry"); $("resMap").textContent=t("toMap");
  $("resultModal").classList.add("open");
  if(passed) sndWin();
  G.result={passed, lv};
}
$("resPassBuy").onclick=()=>{
  if(!G || !G.result || G.result.passed) return;
  if(!spend(PRICE.passBuy)) return;
  const lv=G.result.lv;
  if(!S.stars[lv]) S.stars[lv]=1;
  if(lv===S.unlocked && lv<30) S.unlocked=lv+1;
  save(); sndWin();
  $("resTitle").textContent=t("pass"); $("resStars").textContent="★☆☆";
  $("resPassBuy").classList.add("hidden");
  const nx=$("resNext"); if(lv<30){ nx.classList.remove("hidden"); nx.textContent=t("next"); }
  G.result.passed=true;
};
$("resRetry").onclick=()=>{ $("resultModal").classList.remove("open"); sndClick(); startLevel(G.result.lv); };
$("resNext").onclick=()=>{ $("resultModal").classList.remove("open"); sndClick(); startLevel(G.result.lv+1); };
